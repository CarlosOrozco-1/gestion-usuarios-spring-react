server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gestion-usuarios-backend

  datasource:
    url: ${DB_URL:jdbc:sqlite:gestion_usuarios.db}
    driver-class-name: org.sqlite.JDBC
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        connection:
          init_sql: "PRAGMA foreign_keys = ON"
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET:TuClaveSecretaMuyLargaYSegura2024GestionDeUsuarios!}
  issuer: ${JWT_ISSUER:GestionUsuariosAPI}
  expiration-hours: ${JWT_EXPIRATION_HOURS:8}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}


---
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestion_usuarios_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
    open-in-view: false
